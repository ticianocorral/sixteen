<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Losango do SNES, quatro cores de fábrica -->
  <g transform="translate(64 64) rotate(45)">
    <rect x="-38" y="-38" width="34" height="34" fill="#b3382e"/>
    <rect x="4"   y="-38" width="34" height="34" fill="#c9a227"/>
    <rect x="-38" y="4"   width="34" height="34" fill="#2e6b3f"/>
    <rect x="4"   y="4"   width="34" height="34" fill="#4a3f8f"/>
  </g>
  <!-- O "N" da marca: caixa alta, como no wordmark SixteeN -->
  <text x="64" y="78" font-family="Archivo Black, Arial Black, sans-serif"
        font-size="44" font-style="italic" font-weight="900" fill="#f2ede3"
        text-anchor="middle">N</text>
</svg>
