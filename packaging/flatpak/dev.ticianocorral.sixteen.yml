# Flatpak do SixteeN — o mesmo binário do AppImage, empacotado no formato
# do flatpak-builder. O app não é "sandbox-first": ele mantém a raiz de
# dados portátil (roms/, saves/, core/...), que dentro do sandbox cai em
# ~/.var/app/dev.ticianocorral.sixteen/data/SixteeN (XDG_DATA_HOME remapeado
# pelo flatpak) — sem permissão extra de filesystem. O --filesystem=home
# existe para o app ler ROMs que o jogador deixou em qualquer pasta de casa.
#
# O build usa a rede (cargo baixa as dependências e o SDL3 vendido compila
# via cmake — ambos presentes no org.freedesktop.Sdk), então não é o formato
# "fontes declaradas" exigido pelo Flathub; é um flatpak de instalação
# direta/publicação própria. Idempotente: rode de novo quantas vezes quiser.
id: dev.ticianocorral.sixteen
branch: stable
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sixteen
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
cleanup:
  - /include
  - /lib/cmake
  - "*.a"
  - "*.la"
modules:
  - name: sixteen
    buildsystem: simple
    build-options:
      env:
        # O rustc que vem na extensão do runtime 24.08 (1.89) é mais velho
        # que o MSRV do projeto (1.98) — então o build instala o rustup
        # stable (o mesmo que o CI usa) no $HOME do sandbox. A rede aqui é
        # só para isso e para o cargo baixar as dependências.
        # RUSTUP_TOOLCHAIN ignora o rust-toolchain.toml do repo (que pediria
        # os componentes rustfmt/clippy — desnecessários aqui).
        RUSTUP_TOOLCHAIN: stable
      build-args:
        - --share=network
    build-commands:
      # O rustup TEM de viver no build dir ($PWD): escritas fora dele são
      # descartadas entre um build-command e o próximo, então /home não
      # sobrevive. Mesma variante em todos os comandos porque cada um roda
      # em um shell novo.
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | env CARGO_HOME="$PWD/.cargo-home" RUSTUP_HOME="$PWD/.rustup-home" sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
      - env CARGO_HOME="$PWD/.cargo-home" RUSTUP_HOME="$PWD/.rustup-home" "$PWD/.cargo-home/bin/cargo" build --release --bin sixteen --features sixteen-platform/vendored-sdl
      - install -Dm755 target/release/sixteen /app/bin/sixteen
      - install -Dm644 packaging/flatpak/dev.ticianocorral.sixteen.desktop -t /app/share/applications/
      - install -Dm644 packaging/flatpak/dev.ticianocorral.sixteen.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 packaging/linux/sixteen.png /app/share/icons/hicolor/256x256/apps/dev.ticianocorral.sixteen.png
    sources:
      - type: dir
        path: ../..
