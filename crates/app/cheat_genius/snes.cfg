MEMORY {
    ZP:  start = $0000, size = $0100, type = rw;
    RAM: start = $0100, size = $0100, type = rw;
    ROM: start = $8000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $FF;
    HDR: start = $FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    VEC: start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    HEADER:   load = HDR, type = ro;
    VECTORS:  load = VEC, type = ro;
}
